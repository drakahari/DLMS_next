
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Parse Failed</title>
            <link rel="stylesheet" href="/static/style.css">
            <link rel="icon" href="/static/favicon.ico">
        </head>
        <body class="legacy-shell-page parse-failed-page">
        <script>
        fetch("/config/portal.json")
        .then(r => r.json())
        .then(cfg => {
            if (cfg.background_image) {
                document.documentElement.style.setProperty(
                    "--portal-bg",
                    `url(${cfg.background_image})`
                );
            }
        });
        </script>

        <main class="legacy-shell-main">
            <h1 class="hero-title legacy-shell-heading"><svg class="dlms-icon dlms-inline-icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#warning"></use></svg> Could Not Parse Any Questions</h1>

            <div class="card legacy-shell-card parse-failed-card">
                <p>No valid questions were parsed. Please check the formatting.</p>
                <p>You can download the parser log for troubleshooting:</p>

                <div class="legacy-shell-actions">
                    <button onclick="location.href='/data/{{log_filename}}'">
                        <svg class="dlms-icon dlms-inline-icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#download"></use></svg> Download Parse Log
                    </button>

                    <button onclick="location.href='/upload'">
                        <svg class="dlms-icon dlms-inline-icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#back"></use></svg> Back To Upload Page
                    </button>

                    <button onclick="location.href='/paste'">
                        <svg class="dlms-icon dlms-inline-icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#library"></use></svg> Try Paste Mode Instead
                    </button>

                    <button onclick="location.href='/'">
                        <svg class="dlms-icon dlms-inline-icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#home"></use></svg> Return To Dashboard
                    </button>
                </div>
            </div>
        </main>
        <script src="/static/nav-normalize.js"></script>
</body>
        </html>
