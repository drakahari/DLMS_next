name: Dependency audit

on:
  workflow_dispatch:
  schedule:
    - cron: "41 9 * * 1"

permissions:
  contents: read

jobs:
  python-dependencies:
    name: Audit locked runtime and build dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-audit.txt
            requirements-build.txt
            requirements-test.txt

      - name: Install the dependency auditor
        run: python -m pip install -r requirements-audit.txt

      - name: Audit the canonical frozen-build dependency set
        run: >-
          python -m pip_audit
          --requirement requirements-build.txt
          --progress-spinner off

      - name: Audit the canonical test dependency set
        run: >-
          python -m pip_audit
          --requirement requirements-test.txt
          --progress-spinner off
