name: Firefox release gate

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: firefox-release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firefox-workflows:
    name: Isolated Firefox workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-test.txt

      - name: Install locked runtime and test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Confirm hosted Firefox availability
        run: firefox --version

      - name: Run isolated Firefox release gate
        env:
          DLMS_RUN_BROWSER_TESTS: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest -q -p no:cacheprovider -m browser
          tests/browser/test_critical_workflows.py
