name: Firefox release gate

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Full gate or only the three diagnosed consolidation failures
        type: choice
        default: full
        options:
          - full
          - consolidation-followup
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: firefox-release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firefox-workflows:
    name: Isolated Firefox workflows${{ inputs.scope == 'consolidation-followup' && ' - focused follow-up' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-test.txt

      - name: Install locked runtime and test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Prepare and diagnose Firefox display environment
        run: |
          if ! command -v Xvfb || ! command -v xvfb-run || ! command -v xauth; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y xvfb xauth
          fi
          cat /etc/os-release
          command -v firefox Xvfb xvfb-run xauth
          readlink -f "$(command -v firefox)"
          firefox --version
          dpkg-query -W firefox xvfb xauth
          for variable in DISPLAY MOZ_HEADLESS MOZ_WEBRENDER MOZ_ENABLE_WAYLAND GDK_BACKEND LIBGL_ALWAYS_SOFTWARE; do
            printf '%s=%s\n' "$variable" "${!variable-<unset>}"
          done

      - name: Run isolated Firefox release gate
        env:
          DLMS_RUN_BROWSER_TESTS: "1"
          DLMS_FIREFOX_MODE: xvfb
          GDK_BACKEND: x11
          MOZ_ENABLE_WAYLAND: "0"
          PYTHONDONTWRITEBYTECODE: "1"
          DLMS_FIREFOX_SCOPE: ${{ inputs.scope || 'full' }}
        # xvfb-run owns the X server/auth file and cleans up on command exit.
        # Firefox must not use native --headless with this virtual framebuffer.
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24 -nolisten tcp" \
            bash -euc '
              printf "Firefox mode=%s DISPLAY=%s\n" "$DLMS_FIREFOX_MODE" "$DISPLAY"
              case "$DLMS_FIREFOX_SCOPE" in
                full)
                  selected=(tests/browser/test_critical_workflows.py)
                  ;;
                consolidation-followup)
                  selected=(
                    "tests/browser/test_critical_workflows.py::test_law_guided_create_import_preview_and_cancel_workflow"
                    "tests/browser/test_critical_workflows.py::test_dashboard_generated_resume_identity_and_sequence[dark]"
                    "tests/browser/test_critical_workflows.py::test_study_mistakes_saved_mix_retry_study_exam_and_random[browser_stack0]"
                  )
                  ;;
                *) printf "Unsupported Firefox scope\n" >&2; exit 2 ;;
              esac
              printf "Firefox scope=%s\n" "$DLMS_FIREFOX_SCOPE"
              printf "Browser scope: %s. Focused follow-up is not a new full-gate pass.\n" "$DLMS_FIREFOX_SCOPE" >> "$GITHUB_STEP_SUMMARY"
              python -m pytest -q -p no:cacheprovider -m browser "${selected[@]}"
            '
