name: Firefox release gate

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: firefox-release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firefox-workflows:
    name: Isolated Firefox workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-test.txt

      - name: Install locked runtime and test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Prepare and diagnose Firefox display environment
        run: |
          if ! command -v Xvfb || ! command -v xvfb-run || ! command -v xauth; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y xvfb xauth
          fi
          cat /etc/os-release
          command -v firefox Xvfb xvfb-run xauth
          readlink -f "$(command -v firefox)"
          firefox --version
          dpkg-query -W firefox xvfb xauth
          for variable in DISPLAY MOZ_HEADLESS MOZ_WEBRENDER MOZ_ENABLE_WAYLAND GDK_BACKEND LIBGL_ALWAYS_SOFTWARE; do
            printf '%s=%s\n' "$variable" "${!variable-<unset>}"
          done

      - name: Run isolated Firefox release gate
        env:
          DLMS_RUN_BROWSER_TESTS: "1"
          DLMS_FIREFOX_MODE: xvfb
          GDK_BACKEND: x11
          MOZ_ENABLE_WAYLAND: "0"
          PYTHONDONTWRITEBYTECODE: "1"
        # xvfb-run owns the X server/auth file and cleans up on command exit.
        # Firefox must not use native --headless with this virtual framebuffer.
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24 -nolisten tcp" \
            bash -euc '
              printf "Firefox mode=%s DISPLAY=%s\n" "$DLMS_FIREFOX_MODE" "$DISPLAY"
              python -m pytest -q -p no:cacheprovider -m browser tests/browser/test_critical_workflows.py
            '
