name: Desktop contracts (no publishing)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'desktop_assets/**'
      - 'windows_webview2/**'
      - 'app.py'
      - 'dlms/**'
      - 'templates/**'
      - 'static/**'
      - 'init.sql'
      - 'requirements*.txt'
      - 'tools/run_consolidation_checks.py'
      - 'tests/**'
      - 'package_*/**'
      - '.github/workflows/desktop-contracts.yml'
permissions:
  contents: read
jobs:
  linux-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt -r package_fedora/requirements-build-lock.txt
      - run: python -m pip check
      - name: Install native Qt import prerequisites
        # The wheel needs the runner's EGL loader even with offscreen Qt.
        # This is a disposable CI runner, not a packaged dependency or host fix.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0
          python -c "from PySide6.QtGui import QIcon; from PySide6.QtWebEngineWidgets import QWebEngineView"
      - name: Application and read-only platform contracts
        run: python tools/run_consolidation_checks.py application --basetemp "$RUNNER_TEMP/dlms/application"
      - name: Isolated Qt contract groups
        run: python tools/run_consolidation_checks.py desktop-linux --basetemp "$RUNNER_TEMP/dlms/linux"
      - name: Portable WebView2 controller contracts
        run: python tools/run_consolidation_checks.py windows-portable --basetemp "$RUNNER_TEMP/dlms/windows-portable"
  windows-adapters:
    # SDK/native renderer/frozen acceptance is a separate, explicit handoff.
    # This job validates Python Windows file/process adapters, not native GUI.
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r package_windows_webview2/requirements-build-lock.txt
      - run: python -m pip check
      - name: Windows file, ownership and ordinary-application contracts
        # Hosted runneradmin can create Administrators-owned objects. Keep
        # Desktop's exact-user ownership check; normalize only this test
        # process's creation default and restore it after the same test list.
        run: python -m tests.windows.ci_adapter_contracts
